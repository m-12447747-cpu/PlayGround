<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>RATLEDUNE — Chapter 1: The Boy in the Glass</title>
  <meta name="description" content="A Deltarune-inspired JRPG chapter about a boy, a mirror, and the small bright world behind it." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f1a'/%3E%3Crect x='9' y='6' width='14' height='20' rx='2' fill='%23cfe0ee'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23171326'/%3E%3Crect x='12' y='14' width='2' height='2' fill='%23ff4d4d'/%3E%3Crect x='18' y='14' width='2' height='2' fill='%23ff4d4d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" width="640" height="360" aria-label="Ratledune, a story game. Use arrow keys or WASD to move, Z to interact, X to cancel."></canvas>

    <div id="touch" aria-hidden="true">
      <div class="pad">
        <button class="tb up" data-act="up" aria-label="Up">▲</button>
        <button class="tb left" data-act="left" aria-label="Left">◀</button>
        <button class="tb right" data-act="right" aria-label="Right">▶</button>
        <button class="tb down" data-act="down" aria-label="Down">▼</button>
      </div>
      <div class="acts">
        <button class="tb small" data-act="cancel" aria-label="Cancel">B</button>
        <button class="tb big" data-act="confirm" aria-label="Confirm">A</button>
      </div>
    </div>

    <button id="mute" title="Mute (M)" aria-label="Toggle sound">♪</button>
    <div id="rotate">↻ turn your device for a wider view</div>
    <noscript><div class="fatal">This game needs JavaScript turned on.</div></noscript>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
